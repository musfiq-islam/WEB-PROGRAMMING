<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find a Ride · UIU Ride</title>
<link rel="icon" type="image/png" href="../assets/logo.png">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <header class="app-header" id="app-header"></header>

  <main class="app-main">
    <div class="page-heading">
      <div>
        <h1>Find a Ride</h1>
        <p class="subtitle text-muted">Every ride connects to UIU Campus, one way or the other.</p>
      </div>
    </div>

    <form id="search-form" class="card" style="margin-bottom:20px;">
      <div class="form-row cols-3">
        <div class="field">
          <label for="pickup">Pickup</label>
          <input type="text" id="pickup" data-location placeholder="e.g. UIU Campus">
        </div>
        <div class="field">
          <label for="destination">Destination</label>
          <input type="text" id="destination" data-location placeholder="e.g. Dhanmondi">
        </div>
        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date">
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Search Rides</button>
    </form>

    <div id="results" class="grid grid-2"></div>
  </main>

  <nav class="bottom-nav" id="bottom-nav"></nav>
</div>

<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/locations.js"></script>
<script src="../js/rides.js"></script>
<script>FindRidePage.init();</script>
</body>
</html>
