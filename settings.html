<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings · UIU Ride</title>
<link rel="icon" type="image/png" href="../assets/logo.png">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <header class="app-header" id="app-header"></header>

  <main class="app-main">
    <div class="page-heading"><div><h1>Settings</h1></div></div>

    <div class="card" style="max-width:520px;">
      <h3>Account</h3>
      <p class="text-secondary">Manage your session and account preferences.</p>
      <div style="display:flex; flex-direction:column; gap:12px; margin-top:16px;">
        <a class="btn btn-secondary btn-block" href="profile.html">Edit Profile</a>
        <button class="btn btn-danger btn-block" id="logout-btn">Log Out</button>
      </div>
    </div>
  </main>

  <nav class="bottom-nav" id="bottom-nav"></nav>
</div>

<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/nav.js"></script>
<script>
  Auth.requirePage();
  Nav.render("settings.html");
  document.getElementById("logout-btn").addEventListener("click", () => Auth.logout());
</script>
</body>
</html>
